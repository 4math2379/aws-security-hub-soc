  # Flask Dashboard for Security Hub Findings - minimal volumes
  security-dashboard:
    build: 
      context: .
      dockerfile: Dockerfile-dashboard
    container_name: aws-security-hub-dashboard
    volumes:
      - ./data-processor:/data-processor
      - ./output:/output
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
    networks:
      - aws-security-network

networks:
  aws-security-network:
    driver: bridge
