services:
  # AWS CLI containers for each account - minimal volumes with Prowler
  awscli-account1:
    build: .
    image: aws-security-hub-soc:latest
    container_name: latecoere.aero
    working_dir: /aws-scripts
    volumes:
      - ./aws-scripts:/aws-scripts
      - ./aws-credentials/latecoere.aero:/root/.aws:ro
      - ./data-processor:/data-processor
      - ./output/latecoere.aero:/output
    environment:
      - AWS_DEFAULT_REGION=eu-west-1
      - ACCOUNT_NAME=latecoere.aero
      - AWS_CONFIG_FILE=/root/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      # Prowler specific configurations
      - PROWLER_OUTPUT_DIR=/output/prowler
      - PROWLER_LOG_LEVEL=WARNING
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    networks:
      - aws-security-network

