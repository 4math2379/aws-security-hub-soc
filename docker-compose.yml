services:
  # AWS CLI containers for each account with Prowler integration
  awscli-account1:
    build: .
    image: aws-security-hub-soc:latest
    container_name: latecoere-aero
    working_dir: /aws-scripts
    volumes:
      - ./aws-scripts:/aws-scripts
      - ./aws-credentials/latecoere.aero:/root/.aws:ro
      - ./data-processor:/data-processor
      - ./output/latecoere.aero:/output
      - ./docs:/docs:ro
      - ./templates:/templates:ro
      - ./scripts:/scripts:ro
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - ACCOUNT_NAME=latecoere.aero
      - AWS_CONFIG_FILE=/root/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      # Prowler specific configurations
      - PROWLER_OUTPUT_DIR=/output/prowler
      - PROWLER_LOG_LEVEL=WARNING
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    networks:
      - aws-security-network

  awscli-account2:
    build: .
    image: aws-security-hub-soc:latest
    container_name: aws-ACS-DATA
    working_dir: /aws-scripts
    volumes:
      - ./aws-scripts:/aws-scripts
      - ./aws-credentials/aws-ACS-DATA:/root/.aws:ro
      - ./data-processor:/data-processor
      - ./output/aws-ACS-DATA:/output
      - ./docs:/docs:ro
      - ./templates:/templates:ro
      - ./scripts:/scripts:ro
    environment:
      - AWS_DEFAULT_REGION=eu-west-3
      - ACCOUNT_NAME=aws-ACS-DATA
      - AWS_CONFIG_FILE=/root/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      # Prowler specific configurations
      - PROWLER_OUTPUT_DIR=/output/prowler
      - PROWLER_LOG_LEVEL=WARNING
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    networks:
      - aws-security-network

  awscli-account3:
    build: .
    image: aws-security-hub-soc:latest
    container_name: aws-security-hub-account3
    working_dir: /aws-scripts
    volumes:
      - ./aws-scripts:/aws-scripts
      - ./aws-credentials/account3:/root/.aws:ro
      - ./data-processor:/data-processor
      - ./output/account3:/output
      - ./docs:/docs:ro
      - ./templates:/templates:ro
      - ./scripts:/scripts:ro
    environment:
      - AWS_DEFAULT_REGION=eu-central-1
      - ACCOUNT_NAME=account3
      - AWS_CONFIG_FILE=/root/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      # Prowler specific configurations
      - PROWLER_OUTPUT_DIR=/output/prowler
      - PROWLER_LOG_LEVEL=WARNING
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    networks:
      - aws-security-network

  security-hub-aggregator:
    build: .
    image: aws-security-hub-soc:latest
    container_name: aws-security-hub-aggregator
    working_dir: /aws-scripts
    volumes:
      - ./aws-scripts:/aws-scripts
      - ./aws-credentials/master:/root/.aws:ro
      - ./data-processor:/data-processor
      - ./output/aggregated:/output
      - ./docs:/docs:ro
      - ./templates:/templates:ro
      - ./scripts:/scripts:ro
    environment:
      - AWS_DEFAULT_REGION=eu-central-1
      - ACCOUNT_NAME=master
      - AWS_CONFIG_FILE=/root/.aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      # Prowler and aggregation specific configurations
      - PROWLER_OUTPUT_DIR=/output/prowler
      - PROWLER_LOG_LEVEL=WARNING
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    networks:
      - aws-security-network

  # Flask Dashboard for Security Hub Findings
  security-dashboard:
    build: 
      context: .
      dockerfile: Dockerfile-dashboard
    container_name: aws-security-hub-dashboard
    volumes:
      - ./data-processor:/data-processor
      - ./output:/output
      - ./templates:/templates:ro
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
    networks:
      - aws-security-network
    depends_on:
      - awscli-account1
      - awscli-account2
      - awscli-account3

networks:
  aws-security-network:
    driver: bridge
